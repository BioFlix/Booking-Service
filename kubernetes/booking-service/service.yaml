apiVersion: v1
kind: Service
metadata:
  name: booking-service
  labels:
    app: bioflix
    service: booking-service
spec:
  # Internal only: the API gateway reaches it as http://booking-service:8083 inside the cluster
  type: ClusterIP
  selector:
    service: booking-service
  ports:
    - name: http
      port: 8083
      targetPort: 8083
