server:
  port: 8083

spring:
  application:
    name: booking-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:bookings_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}

  jpa:
    hibernate:
      ddl-auto: validate      # the schema is owned by Flyway (src/main/resources/db/migration)
    open-in-view: false

  flyway:
    enabled: true

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    publisher-confirm-type: simple   # OutboxRelay waits for the broker to confirm before marking an event published
    listener:
      simple:
        # A failing message is retried a few times, then rejected without requeue
        # -> ends up in booking-service.dead-letter
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 5
          initial-interval: 2s
          multiplier: 2
          max-interval: 20s

  grpc:
    client:
      channel:
        catalog:
          target: static://${CATALOG_GRPC_HOST:localhost}:${CATALOG_GRPC_PORT:9090}

app:
  booking:
    # Seats are held this long while the customer pays. After that the booking EXPIRES.
    # NB: Stripe Checkout links live at least 30 min – the group still has to agree on 15 or 30.
    hold-minutes: ${BOOKING_HOLD_MINUTES:15}
    max-seats-per-booking: 10
    expiry-interval: 60s
  catalog:
    timeout: 2s
  rabbitmq:
    exchange: cinema.events
    # Our own dead-letter exchange (direct). Ticket and Notification declare cinema.events.dlx with
    # different types, so we stay out of that one.
    dead-letter-exchange: booking-service.dlx
  outbox:
    poll-interval: 1s
    batch-size: 50
    keep-published-for: 7d

management:
  endpoints:
    web:
      exposure:
        include: health,info
