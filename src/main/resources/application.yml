server:
  port: 8083

spring:
  application:
    name: booking-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/bookings_db
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

  grpc:
    client:
      channel:
        catalog:
          target: static://${CATALOG_GRPC_HOST:localhost}:9090

app:
  booking:
    # Seats are held this long while the customer pays. After that the booking is cancelled.
    payment-timeout-minutes: 15
    max-seats-per-booking: 10

management:
  endpoints:
    web:
      exposure:
        include: health,info
